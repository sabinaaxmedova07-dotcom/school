<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6fc"><title>TAFFY ACADEMY — обучение партнёров</title><style>
:root{--ink:#24212c;--muted:#77717f;--purple:#8c63db;--light:#f7f3ff;--line:#e9e3f0}*{box-sizing:border-box}body{margin:0;background:#fcfbfe;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}header{height:82px;border-bottom:1px solid var(--line);background:#ffffffd9;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.nav{max-width:1120px;margin:auto;padding:0 26px;height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:900;letter-spacing:-1.1px}.logo span{color:var(--purple);font-weight:500}.navlinks{display:flex;gap:28px;font-size:13px;font-weight:600}.navlinks a:hover{color:var(--purple)}main{max-width:1120px;margin:auto;padding:0 26px;min-height:70vh}.hero{padding:98px 0 100px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:380px;height:380px;right:30px;top:50px;border-radius:48%;background:radial-gradient(circle at 32% 28%,#e8d7ff,#a780ea 54%,#8053c4 80%);box-shadow:inset -35px -35px 80px #7950bd44,0 35px 85px #bca3df70;transform:rotate(-20deg);z-index:-1}.eyebrow{color:#8661ca;font-size:12px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase}.hero h1{font-size:clamp(54px,8vw,102px);letter-spacing:-6px;line-height:1.01;margin:20px 0 24px;max-width:720px}.hero p{font-size:18px;line-height:1.65;max-width:530px;color:#605969;margin-bottom:30px}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;border:0;background:var(--purple);color:white;padding:16px 23px;font-weight:700;font-size:14px;transition:.2s}.btn:hover{background:#7449c6;transform:translateY(-1px)}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.section{padding:34px 0 76px}.section h2,.page-title{font-size:clamp(30px,4vw,45px);letter-spacing:-1.8px;margin:12px 0}.sub{color:var(--muted);line-height:1.7;margin:8px 0 30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:28px;min-height:250px;display:flex;flex-direction:column;transition:.2s}.card:hover{border-color:#bca3ec;box-shadow:0 15px 40px #76618b14;transform:translateY(-3px)}.number{color:#8e66d7;font-size:12px;font-weight:800;letter-spacing:1.7px}.card h3{font-size:24px;line-height:1.2;letter-spacing:-.8px;margin:26px 0 12px}.card p{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 24px}.card .go{margin-top:auto;font-weight:700;font-size:13px;color:#7953c2}.banner{background:#f0e8fb;border-radius:24px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner h2{font-size:27px;margin:0 0 10px}.banner p{margin:0;color:#675e73;line-height:1.6}.back{display:inline-block;margin:42px 0 20px;color:#7b59bc;font-size:13px;font-weight:700}.page-head{padding:12px 0 35px}.lesson-list{display:grid;gap:13px;margin-bottom:60px}.lesson-row{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px}.lesson-row:hover{border-color:#bba2e7}.lesson-id{display:grid;place-items:center;flex:0 0 46px;height:46px;border-radius:14px;background:var(--light);color:#7950c4;font-weight:800}.lesson-row h3{margin:0 0 5px;font-size:18px}.lesson-row p{margin:0;color:var(--muted);font-size:13px}.lesson-row .arrow{margin-left:auto;color:#855dcc;font-size:22px}.content{max-width:820px;margin:auto;padding-bottom:80px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;margin:20px 0}.panel h2{font-size:22px;letter-spacing:-.6px;margin:0 0 16px}.panel p,.panel li{color:#5d5763;line-height:1.8}.panel ul{padding-left:20px}.video{background:#221b31;border-radius:16px;aspect-ratio:16/9;display:grid;place-items:center;color:#ddd0f0;text-align:center;padding:20px}.video video{width:100%;height:100%;max-height:460px;border-radius:16px}.pdf{width:100%;height:520px;border:1px solid var(--line);border-radius:14px;background:#f7f5f9}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.task{border-left:4px solid var(--purple);background:#f8f4ff;padding:20px;border-radius:0 12px 12px 0;color:#554b61;line-height:1.8}.done{background:#e9f6ed;color:#2f7750}.footer{border-top:1px solid var(--line);padding:28px;text-align:center;color:#928a9b;font-size:12px}.library-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:25px 0 80px}.tag{font-size:12px;color:#8c63db;font-weight:700}.notice{background:#f5efff;border-radius:12px;padding:14px 18px;color:#6e5c80;font-size:13px;line-height:1.6}.check{display:flex;gap:10px;align-items:center;font-size:14px;color:#665b72;margin:14px 0}.check input{accent-color:#8c63db;width:18px;height:18px}.progress{height:6px;background:#eae2f2;border-radius:8px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:#936cda;transition:width .2s}.tiny{font-size:12px;color:var(--muted)}@media(max-width:800px){.hero{padding:70px 0 110px}.hero:after{width:210px;height:210px;right:-65px;top:205px;opacity:.6}.hero h1{letter-spacing:-3.5px}.grid{grid-template-columns:1fr 1fr}.navlinks{gap:14px}.banner{align-items:flex-start;flex-direction:column}}@media(max-width:560px){header{height:68px}.nav{padding:0 18px}.logo{font-size:17px}.navlinks{font-size:11px;gap:12px}main{padding:0 18px}.hero{padding:65px 0 85px}.hero h1{font-size:57px}.hero p{font-size:16px}.grid,.library-grid{grid-template-columns:1fr}.card{min-height:195px;padding:24px}.card h3{margin-top:20px}.section{padding-bottom:44px}.banner{padding:25px}.panel{padding:19px}.pdf{height:400px}.lesson-row{padding:17px}.lesson-row h3{font-size:16px}}
</style></head><body><header><div class="nav"><a href="#/" class="logo">TAFFY <span>ACADEMY</span></a><nav class="navlinks"><a href="#/">Главная</a><a href="#/modules">Обучение</a><a href="#/library">Библиотека</a></nav></div></header><main id="app"></main><footer class="footer">TAFFY ACADEMY · Обучение партнёров</footer><script>
const modules=[{name:'Знакомство с ТЭФФИ',desc:'Бренд, ассортимент и оформление заказов.',lessons:[['Что такое ТЭФФИ?','Видеоурок и презентация о партнёрской программе.'],['Знакомство с продукцией','Презентация и каталог продукции.'],['Личный кабинет и оформление заказов','Видеоинструкция по работе с заказами.']]},{name:'Первые шаги к продажам',desc:'Простые действия, с которых можно начать сегодня.',lessons:[['С чего начать?','Выбираем товары и делаем первую публикацию.'],['Как найти первых покупателей?','Первые контакты и предложения.']]},{name:'Поиск клиентов и продажи',desc:'Где искать покупателей, как общаться и получать повторные заказы.',lessons:[['Где искать покупателей?','Способы поиска клиентов без большого блога.'],['Как общаться с покупателями?','Готовые сообщения и работа с возражениями.'],['Как получать повторные заказы?','Работа с постоянными покупателями.']]}];
const details={ '1-1':{text:'Посмотрите видеоурок и изучите презентацию. В материалах рассказывается о бренде и принципах партнёрской программы.',pdfs:[['Презентация «ТЭФФИ | УРОК 1»','assets/lesson1.pdf'],['Памятка партнёра','assets/partner-guide.pdf']],task:'Изучите условия партнёрства. Рассчитайте своё вознаграждение с продаж на 5 000, 15 000 и 30 000 ₽ (15% от суммы).'},'1-2':{text:'Ознакомьтесь с ассортиментом. Презентацию и актуальный каталог администратор добавит в этот урок.',task:'Выберите пять товаров, которые хотели бы рекомендовать покупателям.'},'1-3':{text:'Посмотрите инструкцию по работе с личным кабинетом и оформлению заказов.',task:'Откройте личный кабинет, найдите выбранные товары и изучите порядок оформления заказа.'},'2-1':{text:'Для начала не нужно продвигать весь каталог. Выберите три товара, разберитесь в их назначении и расскажите о них аудитории простыми словами.',task:'Выберите три товара и опубликуйте первую сторис или WhatsApp-статус.'},'2-2':{text:'Начните с людей, которым действительно может быть полезна продукция: знакомых родителей, коллег и участников тематических сообществ. Предлагайте товары по потребности, без массовых рассылок.',task:'Выберите пять потенциальных покупателей и начните уместный диалог.'},'3-1':{text:'Источники покупателей: личные рекомендации, WhatsApp-статусы, Instagram, Telegram, родительские чаты, сообщества по интересам и повторные обращения. Учитывайте правила сообществ и не отправляйте спам.',task:'Выберите три канала поиска и попробуйте один из них сегодня.'},'3-2':{text:'Начинайте с вопроса о потребности, затем предлагайте подходящий товар и объясняйте, как оформить заказ. Если человек отказывается, не давите.',task:'Попробуйте один из сценариев в реальном диалоге.'},'3-3':{text:'Сохраняйте контакты покупателей с их согласия, уточняйте впечатления от покупки и напоминайте о повторном заказе в подходящий момент.',task:'Составьте список клиентов, с которыми можно поддерживать связь.'}};
const app=document.getElementById('app');const route=()=>location.hash.slice(1)||'/';const complete=()=>JSON.parse(localStorage.getItem('taffy_done')||'{}');function mark(id){let d=complete();d[id]=!d[id];localStorage.setItem('taffy_done',JSON.stringify(d));render()}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};const link=(href,label,cls='btn')=>`<a class="${cls}" href="${href}">${label}</a>`;const crumb=(href,label)=>`<a class="back" href="${href}">← ${label}</a>`;function moduleCards(){return `<div class="grid">${modules.map((m,i)=>`<a class="card" href="#/module/${i+1}"><div class="number">МОДУЛЬ 0${i+1}</div><h3>${m.name}</h3><p>${m.desc}</p><div class="go">Открыть модуль →</div></a>`).join('')}</div>`}function home(){return `<section class="hero"><div class="eyebrow">Обучение партнёров</div><h1>TAFFY<br>ACADEMY</h1><p>От первых шагов до уверенных продаж. Короткие уроки, понятные задания и материалы, которые помогают действовать.</p>${link('#/module/1','Начать обучение →')}</section><section class="section" id="modules"><div class="eyebrow">Программа</div><h2>Всё по шагам</h2><p class="sub">Три модуля. Восемь практических уроков. Учитесь в удобном темпе.</p>${moduleCards()}</section><section class="section"><div class="banner"><div><h2>Библиотека партнёра</h2><p>Презентации, каталоги и полезные материалы — в одном месте.</p></div>${link('#/library','Открыть библиотеку','btn secondary')}</div></section>`}function modulePage(n){let m=modules[n-1];if(!m)return home();let d=complete(),count=m.lessons.filter((_,i)=>d[`${n}-${i+1}`]).length;return `${crumb('#/modules','Все модули')}<div class="page-head"><div class="eyebrow">МОДУЛЬ 0${n}</div><h1 class="page-title">${m.name}</h1><p class="sub">${m.desc}</p><div class="tiny">Пройдено ${count} из ${m.lessons.length} уроков</div><div class="progress"><div style="width:${count/m.lessons.length*100}%"></div></div></div><div class="lesson-list">${m.lessons.map((l,i)=>`<a class="lesson-row" href="#/lesson/${n}/${i+1}"><div class="lesson-id">${d[`${n}-${i+1}`]?'✓':String(i+1).padStart(2,'0')}</div><div><h3>${l[0]}</h3><p>${l[1]}</p></div><span class="arrow">→</span></a>`).join('')}</div>${n<3?link(`#/module/${n+1}`,'Следующий модуль →','btn secondary'):''}`}
function pdfBlock(title,url){return `<section class="panel"><h2>${esc(title)}</h2><iframe class="pdf" src="${url}#toolbar=1" title="${esc(title)}"></iframe><div class="actions"><a class="btn secondary" target="_blank" rel="noopener" href="${url}">Открыть PDF</a><a class="btn secondary" download href="${url}">Скачать PDF</a></div></section>`}function lessonPage(n,i){let m=modules[n-1],l=m?.lessons[i-1];if(!l)return home();let id=`${n}-${i}`,x=details[id],video=localStorage.getItem('taffy_video_'+id);return `<div class="content">${crumb(`#/module/${n}`,m.name)}<div class="eyebrow">МОДУЛЬ 0${n} / УРОК 0${i}</div><h1 class="page-title">${l[0]}</h1><p class="sub">${l[1]}</p><section class="panel"><h2>Материал урока</h2><p>${x.text}</p></section>${(n===1&&(i===1||i===3))?`<section class="panel"><h2>Видеоурок</h2>${video?`<div class="video"><video controls playsinline preload="metadata" src="${esc(video)}"></video></div>`:`<div class="video">Видеоурок будет добавлен сюда.<br>Смотреть можно будет прямо на сайте.</div>`}</section>`:''}${(x.pdfs||[]).map(p=>pdfBlock(...p)).join('')}${n===1&&i===2?`<section class="panel"><h2>Презентация и каталог</h2><p>Материалы будут добавлены после загрузки файлов.</p></section>`:''}<section class="panel"><h2>Практическое задание</h2><div class="task">${x.task}</div><label class="check"><input type="checkbox" ${complete()[id]?'checked':''} onchange="mark('${id}')"> Я выполнил(а) задание и прошёл(ла) урок</label><p class="tiny">Отметка сохраняется только в этом браузере.</p></section><div class="actions">${i<m.lessons.length?link(`#/lesson/${n}/${i+1}`,'Следующий урок →'):n<3?link(`#/module/${n+1}`,'Следующий модуль →'):link('#/library','Библиотека материалов →')}</div></div>`}function library(){return `${crumb('#/','На главную')}<div class="eyebrow">Для партнёров</div><h1 class="page-title">Библиотека материалов</h1><p class="sub">Документы и инструменты для работы. Новые материалы будут появляться здесь.</p><div class="library-grid"><div class="panel"><div class="tag">PDF · 14 страниц</div><h2>Презентация «Урок 1»</h2><p>Материал первого урока.</p><div class="actions"><a class="btn secondary" target="_blank" href="assets/lesson1.pdf">Открыть</a><a class="btn secondary" href="assets/lesson1.pdf" download>Скачать</a></div></div><div class="panel"><div class="tag">PDF · 10 страниц</div><h2>Памятка партнёра</h2><p>Материалы о партнёрской программе.</p><div class="actions"><a class="btn secondary" target="_blank" href="assets/partner-guide.pdf">Открыть</a><a class="btn secondary" href="assets/partner-guide.pdf" download>Скачать</a></div></div><div class="panel"><div class="tag">Скоро</div><h2>Каталог продукции</h2><p>Добавим актуальный PDF-каталог.</p></div><div class="panel"><div class="tag">Скоро</div><h2>Материалы для продаж</h2><p>Скрипты, фото, видео и тексты для публикаций.</p></div></div>`}function render(){let r=route().split('/').filter(Boolean);app.innerHTML=r.length===0?home():r[0]==='modules'?`${crumb('#/','На главную')}<h1 class="page-title">Программа обучения</h1><p class="sub">Выберите модуль, чтобы начать.</p>${moduleCards()}`:r[0]==='module'?modulePage(+r[1]):r[0]==='lesson'?lessonPage(+r[1],+r[2]):r[0]==='library'?library():home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
